<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">

  <!-- Background -->
  <rect width="800" height="400" fill="#0d1117"/>

  <!-- Grid lines -->
  <g stroke="#161b22" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
  </g>

  <!-- Git branch lines -->
  <g stroke="#1f6feb" stroke-width="3" fill="none">
    <!-- main branch -->
    <line x1="60" y1="200" x2="740" y2="200"/>
    <!-- feature branch -->
    <path d="M 260 200 Q 300 200 320 150 L 500 150 Q 520 150 540 200"/>
    <!-- hotfix branch -->
    <path d="M 440 200 Q 480 200 500 270 L 580 270 Q 600 270 620 200"/>
  </g>

  <!-- Commit dots — main branch -->
  <g fill="#58a6ff">
    <circle cx="100" cy="200" r="10"/>
    <circle cx="200" cy="200" r="10"/>
    <circle cx="260" cy="200" r="10"/>
    <circle cx="540" cy="200" r="10"/>
    <circle cx="620" cy="200" r="10"/>
    <circle cx="700" cy="200" r="10"/>
  </g>

  <!-- Commit dots — feature branch -->
  <g fill="#3fb950">
    <circle cx="360" cy="150" r="10"/>
    <circle cx="440" cy="150" r="10"/>
  </g>

  <!-- Commit dots — hotfix branch -->
  <g fill="#d29922">
    <circle cx="510" cy="270" r="10"/>
    <circle cx="570" cy="270" r="10"/>
  </g>

  <!-- Merge dots -->
  <g fill="#bc8cff">
    <circle cx="540" cy="200" r="13" stroke="#bc8cff" stroke-width="2" fill="none"/>
    <circle cx="620" cy="200" r="13" stroke="#bc8cff" stroke-width="2" fill="none"/>
  </g>

  <!-- Branch labels -->
  <text x="30" y="205" fill="#8b949e" font-size="13" dominant-baseline="middle">main</text>
  <text x="310" y="138" fill="#3fb950" font-size="13">feature/login</text>
  <text x="468" y="288" fill="#d29922" font-size="13">hotfix/bug</text>

  <!-- Commit labels -->
  <text x="100" y="225" fill="#8b949e" font-size="10" text-anchor="middle">init</text>
  <text x="200" y="225" fill="#8b949e" font-size="10" text-anchor="middle">docs</text>
  <text x="360" y="130" fill="#8b949e" font-size="10" text-anchor="middle">feat</text>
  <text x="440" y="130" fill="#8b949e" font-size="10" text-anchor="middle">test</text>
  <text x="510" y="290" fill="#8b949e" font-size="10" text-anchor="middle">fix</text>
  <text x="570" y="290" fill="#8b949e" font-size="10" text-anchor="middle">fix</text>
  <text x="540" y="225" fill="#8b949e" font-size="10" text-anchor="middle">merge</text>
  <text x="620" y="225" fill="#8b949e" font-size="10" text-anchor="middle">merge</text>
  <text x="700" y="225" fill="#8b949e" font-size="10" text-anchor="middle">release</text>

  <!-- Title -->
  <text x="400" y="50" fill="#e6edf3" font-size="20" font-weight="600" text-anchor="middle">Git Branch Graph — sample.svg</text>
  <text x="400" y="75" fill="#8b949e" font-size="13" text-anchor="middle">SVG renders as a crisp vector image on GitHub — scales to any size</text>

  <!-- Legend -->
  <g transform="translate(55, 340)">
    <circle cx="0" cy="0" r="6" fill="#58a6ff"/>
    <text x="12" y="4" fill="#8b949e" font-size="12">main</text>
    <circle cx="80" cy="0" r="6" fill="#3fb950"/>
    <text x="92" y="4" fill="#8b949e" font-size="12">feature</text>
    <circle cx="170" cy="0" r="6" fill="#d29922"/>
    <text x="182" y="4" fill="#8b949e" font-size="12">hotfix</text>
    <circle cx="240" cy="0" r="6" fill="none" stroke="#bc8cff" stroke-width="2"/>
    <text x="252" y="4" fill="#8b949e" font-size="12">merge commit</text>
  </g>

</svg>