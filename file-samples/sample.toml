# Sample TOML File
# GitHub displays TOML with syntax highlighting

[project]
name = "github-handbook"
version = "1.0.0"
description = "A beginner-to-advanced Git & GitHub learning handbook"
license = "MIT"
authors = ["Your Name <you@example.com>"]

[project.urls]
homepage = "https://github.com/yourusername/github-handbook"
repository = "https://github.com/yourusername/github-handbook"
documentation = "https://github.com/yourusername/github-handbook#readme"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.backends.legacy:build"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[dependencies]
python = ">=3.11"
requests = ">=2.28"
rich = ">=13.0"

[dev-dependencies]
pytest = ">=7.0"
ruff = ">=0.1"
mypy = ">=1.0"
